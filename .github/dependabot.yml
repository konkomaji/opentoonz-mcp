version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # mcp 2.x renamed FastMCP and changed the server API; I move to it deliberately, not via a bot bump.
      # An update-types rule did not stop the grouped range update (#5, #6), so I name the versions.
      - dependency-name: "mcp"
        versions: [">=2"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
