name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Trusted pip and certifi (emSign CA incident, Oct 2026)
        # hash-pinned pip 26.2.2 first: older pip trusts its own vendored certifi
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade "certifi>=2026.10.19"
      - name: Tag, versions and changelog agree
        run: python scripts/release_check.py --tag "${GITHUB_REF_NAME}" --notes release-notes.md
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  test:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Trusted pip and certifi (emSign CA incident, Oct 2026)
        # hash-pinned pip 26.2.2 first: older pip trusts its own vendored certifi
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade "certifi>=2026.10.19"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not slow" -q

  pypi:
    name: Publish to PyPI
    needs: [verify-build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opentoonz-mcp/
    permissions:
      id-token: write   # PyPI trusted publishing: no API token is stored in the repository
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    name: Publish to the MCP Registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login for io.github.konkomaji/* server names
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Wait until PyPI serves the new version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/opentoonz-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "::error::opentoonz-mcp $v did not appear on PyPI"
          exit 1
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create the release with the changelog section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
