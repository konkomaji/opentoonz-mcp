name: Publish to the MCP Registry

# Re-publishes server.json from main for a version that is already on PyPI
# (for example when the registry step of a release failed). The tag stays where it is.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-registry:
    name: Publish server.json
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC login for io.github.konkomaji/* server names
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Trusted pip and certifi (emSign CA incident, Oct 2026)
        # hash-pinned pip 26.2.2 first: older pip trusts its own vendored certifi
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade "certifi>=2026.10.19"
      - name: server.json is valid for this release
        run: python scripts/release_check.py
      - name: The version is on PyPI
        run: |
          v=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          curl -fsS "https://pypi.org/pypi/opentoonz-mcp/$v/json" >/dev/null
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
